name: Termux emulator test

# Boots a real Android (arm64) emulator on a GitHub-hosted arm64 runner (KVM),
# installs Termux inside it and runs the dsh installer there, so that the
# result is checked on Android and not only on Linux.
#
# Results are committed to ci-results/<run id>/ on the same branch, so they can
# be read through the GitHub API (job logs are not reachable from every network).
#
# Runs on manual dispatch, or when this workflow file / its scripts change on
# the working branch. It is not part of the regular CI.

on:
  workflow_dispatch:
    inputs:
      installer_repo:
        description: "GitHub repo (owner/name) that contains install.sh"
        required: false
        default: "lilyco-42/dsh-termux"
      installer_ref:
        description: "Branch, tag or commit of the installer repo"
        required: false
        default: "main"
      api_level:
        description: "Android API level of the emulator system image"
        required: false
        default: "34"
  push:
    branches:
      - arena/071a9cd5-dsh-termux-native-o-android-ai
    paths:
      - ".github/workflows/termux-emulator.yml"
      - ".github/termux-ci/**"

concurrency:
  group: termux-emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_APK_URL: "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_arm64-v8a.apk"
  INSTALLER_REPO: ${{ inputs.installer_repo || 'lilyco-42/dsh-termux' }}
  INSTALLER_REF: ${{ inputs.installer_ref || 'main' }}
  API_LEVEL: ${{ inputs.api_level || '34' }}

jobs:
  termux-on-android:
    name: Install dsh in Termux on Android (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check KVM
        run: |
          uname -m
          grep -m1 -o -E 'vmx|svm|asimd' /proc/cpuinfo || true
          ls -l /dev/kvm 2>&1 || echo "no /dev/kvm"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm 2>&1 || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Download Termux APK (github-debug build, run-as enabled)
        run: |
          mkdir -p ci-apk
          curl -fL --retry 3 -o ci-apk/termux.apk "$TERMUX_APK_URL"
          ls -l ci-apk/termux.apk

      - name: Boot emulator, install Termux, run installer inside Termux
        timeout-minutes: 130
        env:
          API_LEVEL: ${{ env.API_LEVEL }}
        run: bash .github/termux-ci/run-on-emulator.sh

      - name: Publish results to ci-results/ on this branch
        if: always()
        run: |
          set +e
          RUN_DIR="ci-results/${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          cp -r ci-logs/. "$RUN_DIR/" 2>/dev/null
          echo "run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} installer=${INSTALLER_REPO}@${INSTALLER_REF} api=${API_LEVEL}" > "$RUN_DIR/meta.txt"
          git config user.name "termux-ci"
          git config user.email "termux-ci@users.noreply.github.com"
          git add -f ci-results
          git commit -qm "ci: termux emulator results for run ${GITHUB_RUN_ID}"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "published to $RUN_DIR"
          ls -la "$RUN_DIR"

      - name: Upload Termux and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-emulator-logs
          path: ci-logs/
          if-no-files-found: warn
